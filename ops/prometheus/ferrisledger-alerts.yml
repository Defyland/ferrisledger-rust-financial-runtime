groups:
  - name: ferrisledger-runtime
    rules:
      - alert: FerrisLedgerHighErrorRate
        expr: |
          sum(rate(ferrisledger_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(ferrisledger_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FerrisLedger HTTP 5xx rate is above 5%.
      - alert: FerrisLedgerRateLimitSpike
        expr: rate(ferrisledger_api_rate_limited_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: FerrisLedger is rejecting many requests by rate limit.
      - alert: FerrisLedgerNoVerifiedRecords
        expr: ferrisledger_event_store_records == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: FerrisLedger readiness has not observed persisted events.
