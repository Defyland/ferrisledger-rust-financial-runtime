services:
  ferrisledger:
    build: .
    ports:
      - "8080:8080"
    environment:
      FERRISLEDGER_API_KEY: "${FERRISLEDGER_API_KEY:?Set FERRISLEDGER_API_KEY before running docker compose}"
      FERRISLEDGER_STORE_PATH: /data/events.jsonl
      FERRISLEDGER_RATE_LIMIT_PER_MINUTE: "${FERRISLEDGER_RATE_LIMIT_PER_MINUTE:-120}"
      FERRISLEDGER_AUTH_FAILURE_RATE_LIMIT_PER_MINUTE: "${FERRISLEDGER_AUTH_FAILURE_RATE_LIMIT_PER_MINUTE:-60}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "ferrisledger", "verify", "--store-path", "/data/events.jsonl"]
      interval: 10s
      timeout: 3s
      retries: 3
